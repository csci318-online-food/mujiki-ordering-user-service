# Spring Configuration
spring:
  application:
    name: user
  h2:
    console:
      enabled: true
      path: /h2-console
  datasource:
    url: jdbc:h2:mem:mujiki_user
    username: mujiki_user
    password: nothing

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  liquibase:
    change-log: classpath:logs/db.changelog-master.xml
    enabled: true

  # Spring Cloud Stream - Kafka Configuration
  cloud:
    stream:
      kafka:
        binder:
          brokers: localhost:9092  # Kafka broker location, can be a list for multiple brokers
      bindings:
        handleOrderStatusEvent-in-0:
          destination: mujikiOrderEvent     # Topic for Mujiki Order Events
          content-type: application/json    # Content type for messages

# API Configuration
api:
  endpoint:
    base-url: /api

address:
  url:
    service: http://localhost:8083/api/address

# Server Configuration
server:
  error:
    whitelabel:
      enabled: false
  port: 8081
